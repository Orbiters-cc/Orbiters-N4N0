# `cargo xtask <command>`: Orbiters desktop's release tooling (xtask/, docs/releasing.md).
[alias]
xtask = "run --package xtask --"

# audiopus_sys's Opus still says `cmake_minimum_required(VERSION 2.8)`, which CMake 4 refuses unless told which policies to use.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
# The release's version, written by `cargo xtask bump`: what the programs say they are (orbiters-version says why it is
# not each crate's own version: a development bump then recompiles the programs, not all 25 crates).
ORBITERS_VERSION = "0.3.6-dev.19"
