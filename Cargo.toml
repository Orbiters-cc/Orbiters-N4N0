[workspace]
resolver = "2"
members = ["crates/orbiters-core", "crates/orbiters-spout", "crates/orbiters-capture", "crates/orbiters-ui", "crates/orbiters-desktop", "crates/orbiters-openvr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Enzo DUTRA / blackorbit"]
publish = false

[workspace.dependencies]
orbiters-contracts = { path = "contracts/Rust~" }
orbiters-core = { path = "crates/orbiters-core" }
orbiters-spout = { path = "crates/orbiters-spout" }
orbiters-openvr = { path = "crates/orbiters-openvr" }
orbiters-ui = { path = "crates/orbiters-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
rayon = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
rosc = "0.11"
mdns-sd = "0.21"
flate2 = "1"
egui = "0.37"
egui-wgpu = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "clipboard", "wayland", "x11"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
tiny-skia = "0.12"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decoders and image codecs are far too slow unoptimised; keep dependencies fast in debug builds too.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.orbiters-contracts]
opt-level = 3

# The CPU painter of the VR overlay too.
[profile.dev.package.orbiters-ui]
opt-level = 3
