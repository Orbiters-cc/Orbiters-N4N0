[workspace]
resolver = "2"
members = ["crates/orbiters-projects", "crates/orbiters-core", "crates/orbiters-spout", "crates/orbiters-capture", "crates/orbiters-ui", "crates/orbiters-desktop", "crates/orbiters-openvr", "crates/orbiters-reconstruct", "crates/orbiters-sound", "crates/orbiters-n4n0-core", "crates/orbiters-n4n0", "crates/orbiters-audio", "crates/orbiters-voice", "crates/orbiters-call", "crates/orbiters-update", "crates/orbiters-setup", "crates/orbiters-smooth", "crates/orbiters-smooth-driver", "xtask"]

[workspace.package]
version = "0.3.4-dev.29"
edition = "2021"
authors = ["Enzo DUTRA / blackorbit"]
publish = false

[workspace.dependencies]
orbiters-projects = { path = "crates/orbiters-projects" }
orbiters-contracts = { path = "contracts/Rust~" }
orbiters-core = { path = "crates/orbiters-core" }
orbiters-spout = { path = "crates/orbiters-spout" }
orbiters-openvr = { path = "crates/orbiters-openvr" }
orbiters-ui = { path = "crates/orbiters-ui" }
orbiters-sound = { path = "crates/orbiters-sound" }
orbiters-n4n0-core = { path = "crates/orbiters-n4n0-core" }
orbiters-n4n0 = { path = "crates/orbiters-n4n0" }
orbiters-audio = { path = "crates/orbiters-audio" }
orbiters-update = { path = "crates/orbiters-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
rayon = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
rosc = "0.11"
mdns-sd = "0.21"
flate2 = "1"
egui = "0.37"
egui-wgpu = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "clipboard", "wayland", "x11"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
tiny-skia = "0.12"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Dragging pictures out of Photos & captures into other apps (orbiters-desktop drag_out.rs).
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_UI_Shell_Common",
    "Win32_System_SystemServices",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Line tables keep panics and backtraces readable (file and line) at a fraction of the size of full debug information,
# which made `target/debug` tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

# Decoders and image codecs are far too slow unoptimised; keep dependencies fast in debug builds too.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.orbiters-contracts]
opt-level = 3

# The CPU painter of the VR overlay too.
[profile.dev.package.orbiters-ui]
opt-level = 3
