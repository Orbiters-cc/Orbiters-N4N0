[package]
name = "orbiters-desktop"
description = "Orbiters desktop: capture VRChat worlds and bring them into Unity with Mixer."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "orbiters_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
orbiters-core = { workspace = true }
orbiters-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sysinfo = "0.37"
trash = "5"

[target.'cfg(windows)'.dependencies]
orbiters-spout = { workspace = true }
