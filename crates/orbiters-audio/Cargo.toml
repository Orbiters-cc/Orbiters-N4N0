[package]
name = "orbiters-audio"
description = "Microphones and a process's sound through WASAPI, as packets of float samples on the shared clock (capture worker, voice worker)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
orbiters-core = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.62"
