[package]
name = "orbiters-call"
description = "N4N0's calls, a worker process: WebRTC audio (Opus) between two Orbiters - N4N0 apps, through Cloudflare Realtime TURN (only, unless a call is direct)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
orbiters-version = { workspace = true }
orbiters-i18n = { workspace = true }
orbiters-core = { workspace = true }
orbiters-sound = { workspace = true }
anyhow = { workspace = true }
# WebRTC's own warnings (a relay it skips, a socket it could not bind) on stderr, which the service logs.
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
# The runtime-agnostic rewrite: tokio runtime and ring crypto (its defaults).
webrtc = "0.21"
# The sans-I/O core under webrtc: the codec, track and sample types it does not re-export (its crypto comes from webrtc's features).
rtc = { version = "0.21.1", default-features = false }
async-trait = "0.1"
bytes = "1"
audiopus = "0.3.0-rc.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
