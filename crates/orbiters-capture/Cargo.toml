[package]
name = "orbiters-capture"
description = "Capture worker of Orbiters - N4N0: frame sources (Spout, raw captures, test pattern), strip and depth decoding, session bundles."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orbiters-capture"
path = "src/main.rs"

[dependencies]
orbiters-core = { workspace = true }
orbiters-contracts = { workspace = true }
orbiters-openvr = { workspace = true }
orbiters-audio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
orbiters-spout = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The disk's free space (session.rs).
libc = "0.2"
