[package]
name = "orbiters-core"
description = "Shared logic of Orbiters desktop: settings, session bundles, keyframes, VRChat log, OSC, worker protocol."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
orbiters-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
rosc = { workspace = true }
mdns-sd = { workspace = true }
flate2 = { workspace = true }
if-addrs = "0.15"
socket2 = "0.6"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls", "gzip", "multipart"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Cryptography"] }
