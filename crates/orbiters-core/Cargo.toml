[package]
name = "orbiters-core"
description = "Shared logic of Orbiters - N4N0: settings, session bundles, keyframes, VRChat log, OSC, worker protocol."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
orbiters-i18n = { workspace = true }
orbiters-booster = { workspace = true }
orbiters-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
rosc = { workspace = true }
mdns-sd = { workspace = true }
flate2 = { workspace = true }
if-addrs = "0.15"
memchr = "2"
socket2 = { version = "0.6", features = ["all"] }
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false, features = ["json", "gzip", "multipart"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Cryptography"] }

# The session store's key in the login keychain, and its AES-GCM (`dpapi`; ring is already built for the releases' signatures).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
ring = "0.17"

# TLS (`http_tls`): Windows' own through native TLS on the desktop; rustls with ring on Android, where native TLS would
# mean OpenSSL. Crates that reach the web through this one take its TLS.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
