[package]
name = "orbiters-core"
description = "Shared logic of Orbiters - N4N0: settings, session bundles, keyframes, VRChat log, OSC, worker protocol."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
orbiters-version = { workspace = true }
orbiters-i18n = { workspace = true }
orbiters-booster = { workspace = true }
orbiters-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
rosc = { workspace = true }
mdns-sd = { workspace = true }
flate2 = { workspace = true }
if-addrs = "0.15"
memchr = "2"
unicode-normalization = "0.1.26"
socket2 = { version = "0.6", features = ["all"] }
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false, features = ["json", "gzip", "multipart"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# The session store's key in the login keychain, and its AES-GCM (`dpapi`; ring is already built for the releases' signatures).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# CFData for an add-only keychain item (`dpapi`), the version security-framework 3 uses.
core-foundation = "0.10"
ring = "0.17"

# TLS (`http_tls`): the system's own through native TLS on Windows and the Mac; rustls with ring on Linux and Android, where
# native TLS would mean OpenSSL. Crates that reach the web through this one take its TLS.
[target.'cfg(not(any(target_os = "android", target_os = "linux")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# VRChat's pipeline (`pipeline.rs`): the TLS ureq already brings in.
native-tls = "0.2"

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
# VRChat's pipeline (`pipeline.rs`): the TLS ureq already brings in there.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The session store's AES-GCM and its key (`dpapi`).
ring = "0.17"

# A disk's free space (`disk`), the clock ticks of `/proc` (`processes`).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
