[package]
name = "orbiters-desktop"
description = "Orbiters desktop: capture VRChat worlds and bring them into Unity with Mixer."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orbiters-desktop"
path = "src/main.rs"

[dependencies]
orbiters-core = { workspace = true }
orbiters-contracts = { workspace = true }
orbiters-ui = { workspace = true }
orbiters-sound = { workspace = true }
orbiters-orb = { workspace = true }
orbiters-reconstruct = { path = "../orbiters-reconstruct" }
bytemuck = { workspace = true }
orbiters-openvr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
png = { workspace = true }
rosc = { workspace = true }
rfd = "0.17"
sysinfo = "0.37"
trash = "5"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
orbiters-spout = { workspace = true }
windows = { workspace = true, features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
tray-icon = "0.26"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
