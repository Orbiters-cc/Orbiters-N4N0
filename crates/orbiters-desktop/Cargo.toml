[package]
name = "orbiters-desktop"
description = "Orbiters - N4N0: capture VRChat worlds and bring them into Unity with Mixer."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orbiters-desktop"
path = "src/main.rs"

[dependencies]
orbiters-i18n = { workspace = true }
orbiters-projects = { workspace = true }
orbiters-core = { workspace = true }
orbiters-booster = { workspace = true }
orbiters-contracts = { workspace = true }
orbiters-ui = { workspace = true }
orbiters-sound = { workspace = true }
orbiters-n4n0-core = { workspace = true }
orbiters-n4n0 = { workspace = true }
orbiters-update = { workspace = true, features = ["net"] }
orbiters-reconstruct = { workspace = true }
bytemuck = { workspace = true }
orbiters-openvr = { workspace = true }
orbiters-smooth = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
uuid = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
png = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rosc = { workspace = true }
ureq = { version = "3", default-features = false, features = ["json", "native-tls", "gzip"] }
rfd = "0.17"
sysinfo = "0.37"
trash = "5"
arboard = { version = "3", default-features = false }
# The QR code scanner (N4N0's menu, More): QR codes in VRChat's stream camera. Pure Rust, MIT or Apache-2.0 (quirc's ISC parts).
rqrr = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
orbiters-spout = { workspace = true }
orbiters-web = { path = "../orbiters-web" }
windows = { workspace = true, features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_JobObjects", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Media_Control", "Storage_Streams", "Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Direct3D12", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_Storage_Xps", "Win32_UI_Input", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
raw-window-handle = "0.6"
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26"
# eframe's: the window process's activation policy (window.rs).
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSGeometry", "NSNotification", "NSObject", "NSProcessInfo", "NSRunLoop", "NSDate"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSRunningApplication", "NSResponder", "NSEvent", "NSWindow", "NSView", "NSGraphics", "NSImage", "NSImageRep", "NSBitmapImageRep",
    "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSPasteboardItem", "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }

[dev-dependencies]
orbiters-core = { workspace = true, features = ["test-support"] }
# Draws the QR codes the scanner's tests read.
qrcode = { version = "0.14", default-features = false }
# Reads back the SPZ files Export writes (version 3: one gzip stream).
flate2 = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
