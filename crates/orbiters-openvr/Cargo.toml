[package]
name = "orbiters-openvr"
description = "Minimal SteamVR (OpenVR) client for Orbiters - N4N0: loads the installed runtime's vrclient, device poses and properties, overlays."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
orbiters-i18n = { workspace = true }
orbiters-contracts = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_LibraryLoader"] }
