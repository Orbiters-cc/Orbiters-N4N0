[package]
name = "orbiters-orb"
description = "N4N0, the Orbiters companion: its text panel, avatar controls, assistant client and helpers, without IO threads."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
orbiters-contracts = { workspace = true }
orbiters-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rosc = { workspace = true }
ureq = { version = "3", default-features = false, features = ["json", "native-tls", "gzip"] }
# Thumbnails for the menu (already built for tiff in the lockfile).
zune-jpeg = "0.5"
zune-core = "0.5"
# Music art (apps hand PNG as often as JPEG).
png = { workspace = true }
