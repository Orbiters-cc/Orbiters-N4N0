[package]
name = "orbiters-projects"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
orbiters-i18n = { workspace = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
uuid.workspace = true
time.workspace = true
orbiters-core.workspace = true
# The release key a served Unity 6 release list is checked against (unity6::matrix), and its Ed25519 check.
orbiters-update = { workspace = true, features = ["signing"] }
ring = "0.17"
base64 = "0.22"
# A local package archive's own manifest (unity6::payload).
flate2 = { workspace = true }
vrc-get-vpm = { version = "=0.0.17", features = ["experimental-project-management", "experimental-unity-management"] }
# Reads Creator Companion's and ALCOM's project list (theirs.rs), with the reader vrc-get itself has; never writes it.
vrc-get-litedb = { version = "=0.3.0-beta.8", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
indexmap = "2"
futures = "0.3"
url = "2"
walkdir = "2"
# Package icons (icons.rs): what websites serve, decoded and kept small.
# EXR and HDR: lightmaps and skies (scene/world.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "tga", "bmp", "tiff", "exr", "hdr"] }
# Models of projects never opened in Unity (scene/model.rs): FBX (binary and ASCII) and OBJ, read as Unity imports them.
ufbx = "0.11.5"
resvg = { version = "0.49", default-features = false }
# Unity editors open on the computer and the projects they have open (editor.rs).
sysinfo = "0.37"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
junction = "2.1.0"

# Free space, the project lock's probe and the priority of workers off Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Unity's and Blender's bundles, the volumes mounted, and the applications running (mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# Unity Hub's download and Unity's release data (unity_install.rs), with the app's own agent.
ureq = { version = "3", default-features = false }
plist = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }

[dev-dependencies]
# Tests of it have their own app data and VCC folder, never the person's.
orbiters-core = { workspace = true, features = ["test-support"] }
tempfile = "3"
