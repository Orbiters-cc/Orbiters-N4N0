[package]
name = "orbiters-qr"
description = "Reads the QR codes in VRChat's camera picture: styled ones (inverted, coloured, a logo in the middle) too, and says when a code is seen but cut by the frame."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rqrr = { version = "0.11", default-features = false }
# ZXing's QR reader (Apache-2.0): Request 18, codes rqrr could not fit a grid to.
rxing = { version = "0.9.4", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
png = { workspace = true }
