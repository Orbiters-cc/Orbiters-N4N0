[package]
name = "orbiters-reconstruct"
description = "Reconstruction worker of Orbiters - N4N0: trains Gaussian splats from a session's lossless keyframes, exact poses and exact depth (replay mode), on the GPU through wgpu."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orbiters-reconstruct"
path = "src/main.rs"

[dependencies]
orbiters-core = { workspace = true }
orbiters-contracts = { workspace = true }
orbiters-openvr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
wgpu = "30"
fastrand = "2"
# The face detector (crate::portraits), through the ONNX Runtime the voice worker ships, beside the programs.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std"] }
zstd = "0.13"
# SPZ version 3's single gzip stream (crate::export::spz3), the version every SPZ reader opens.
flate2 = "1"
rayon = { workspace = true }
# The sky map's sky.png (crate::sky).
png = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
sysinfo = "0.37"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
# wgpu-hal's: the Vulkan device's queue priority and the memory budget (crate::gpu).
ash = "0.38"

[dev-dependencies]
half = "2.7"
naga = { version = "30", features = ["wgsl-in", "hlsl-out", "spv-out"] }
