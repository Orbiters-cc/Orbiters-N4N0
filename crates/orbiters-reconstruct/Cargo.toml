[package]
name = "orbiters-reconstruct"
description = "Reconstruction worker of Orbiters desktop: trains Gaussian splats from a session's lossless keyframes, exact poses and exact depth (replay mode), on the GPU through wgpu."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orbiters-reconstruct"
path = "src/main.rs"

[dependencies]
orbiters-core = { workspace = true }
orbiters-contracts = { workspace = true }
orbiters-openvr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
wgpu = "30"
# wgpu-hal's: the Vulkan device's queue priority and the memory budget (crate::gpu).
ash = "0.38"
fastrand = "2"
rayon = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
sysinfo = "0.37"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in", "hlsl-out", "spv-out"] }
png = { workspace = true }
