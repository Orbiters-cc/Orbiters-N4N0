[package]
name = "orbiters-setup"
description = "Orbiters - N4N0's setup: installs, updates and uninstalls it for the person (no administrator rights), in the Orbiters look."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orbiters-setup"
path = "src/main.rs"

[dependencies]
orbiters-i18n = { workspace = true }
orbiters-update = { workspace = true, features = ["payload"] }
# SteamVR's start of the app (its application manifest), set while SteamVR runs.
orbiters-openvr = { workspace = true }
# Tracking smoothing's SteamVR driver, which the app registers: an uninstall takes it out of SteamVR's list.
orbiters-smooth = { workspace = true }
# What the FPS booster changed comes back at an uninstall, and this program is what can restore it afterwards.
orbiters-booster = { workspace = true }
serde_json = { workspace = true }
orbiters-ui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
anyhow = { workspace = true }
png = { workspace = true }
time = { workspace = true }
dirs = { workspace = true }
# Telling a file of the payload already in the install folder from one of the person's (install.rs).
sha2 = "0.10"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
