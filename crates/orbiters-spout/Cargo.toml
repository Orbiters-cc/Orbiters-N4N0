[package]
name = "orbiters-spout"
description = "Spout2 receiver and test sender (Windows, Direct3D 11), protocol-compatible with the Spout2 SDK."
version.workspace = true
edition.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
orbiters-contracts = { workspace = true }
# examples/qr_sender: a code shown as VRChat's stream camera would (K-qr-page sandbox runs).
qrcode = { version = "0.14", default-features = false }

[dependencies]
orbiters-i18n = { workspace = true }
