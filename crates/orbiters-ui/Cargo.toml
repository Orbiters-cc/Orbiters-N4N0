[package]
name = "orbiters-ui"
description = "Orbiters interface toolkit: theme, springs, glow background, widgets and an offscreen renderer, shared by the desktop window and the VR overlay."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
orbiters-i18n = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
png = { workspace = true }
tiny-skia = { workspace = true }
anyhow = { workspace = true }
# System fonts mapped instead of read, and their character maps (skrifa is egui's own font reader).
memmap2 = "0.9"
skrifa = "0.44"
# The photo editor (photo): its pixels worked on every core, its edits saved as JSON.
rayon = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# The backdrop blur's shader is parsed and validated in its tests (the version wgpu itself uses).
naga = { version = "30", features = ["wgsl-in"] }
