[package]
name = "orbiters-voice"
description = "N4N0's ears: the voice worker of Orbiters - N4N0. Listens to the microphone, finds sentences (Silero VAD) and transcribes them on this computer (NVIDIA Parakeet through sherpa-onnx)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orbiters-voice"
path = "src/main.rs"

[dependencies]
orbiters-i18n = { workspace = true }
orbiters-core = { workspace = true }
orbiters-audio = { workspace = true }
# The wake word's rules: a long sentence is transcribed whole only when its start holds one.
orbiters-n4n0-core = { workspace = true }
# The models' SHA-256, computed while they download.
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# Its TLS is orbiters-core's, per platform (`orbiters_core::http_tls`).
ureq = { version = "3", default-features = false }
tar = "0.4"
bzip2 = "0.4"
# The prebuilt shared libraries (sherpa-onnx's C API and ONNX Runtime) sit next to the worker: built with the MSVC
# runtime the Rust target uses, unlike the static ones.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
